aid: fandom
name: Fandom
description: 'Fandom (formerly Wikia) is the world''s largest entertainment fan-wiki
  platform, hosting hundreds of thousands of community-run wikis covering television,
  film, games, anime, and pop culture. Every Fandom wiki runs on MediaWiki (currently
  1.43.9, PHP 8.3) and exposes the standard MediaWiki Action API at /api.php on each
  wiki subdomain, giving programmatic read and write access to page content, revisions,
  full-text and OpenSearch search, media files, templates, and account operations.
  Fandom layers its own extension modules on top of core MediaWiki (create-new-wiki,
  theme designer, interactive maps, portable infoboxes, embedded video, notifications).
  Fandom does not publish a bespoke OpenAPI; the self-documenting api.php help endpoint,
  the Fandom Developers Wiki (dev.fandom.com), and the upstream MediaWiki API docs
  are the reference surface. This profile was surfaced as a portfolio company of Bessemer
  Venture Partners and enriched from Fandom''s live, public API.'
