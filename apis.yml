apis:
- name: Fandom MediaWiki Action API
  description: 'The standard MediaWiki Action API served at /api.php on every Fandom
    wiki subdomain (e.g. community.fandom.com, starwars.fandom.com). Provides read/write
    access via 120 action modules including query, parse, edit, upload, opensearch,
    login/clientlogin, and Fandom-specific extensions (createnewwiki, savetheme, getmap,
    infobox, embedvideo). Self-documenting via action=help and action=paraminfo. Running
    MediaWiki 1.43.9.'
